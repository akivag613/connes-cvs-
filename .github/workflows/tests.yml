name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  fast:
    name: base fast · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package at the declared mpmath floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mpmath==1.3.0" pytest pytest-timeout

      - name: Confirm the dependency floor and pure-mpmath backend
        run: |
          python -c "import mpmath; assert mpmath.__version__ == '1.3.0'"
          python -c "from connes_cvs.operator import HAS_FLINT; assert not HAS_FLINT"

      - name: Run fast suite
        run: python -m pytest -v

  flint-oldest:
    name: oldest Flint compatibility · ubuntu · py3.10 · flint0.5.0
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout \
            "mpmath==1.3.0" "python-flint==0.5.0"
      - name: Confirm exact oldest backend
        run: |
          python -c "import flint, mpmath; assert flint.__version__ == '0.5.0'; assert mpmath.__version__ == '1.3.0'"
          python -c "from connes_cvs.operator import HAS_FLINT; assert HAS_FLINT"
      - name: Run validator and full fast suite with Flint
        run: |
          python -m pytest -v tests/test_validation.py
          python -m pytest -v

  flint-latest:
    name: latest Flint compatibility · ubuntu · py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install latest compatible Flint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout
          python -m pip install --upgrade mpmath python-flint
      - name: Confirm Flint-backed execution
        run: |
          python -c "import flint, mpmath; from connes_cvs.operator import HAS_FLINT; assert HAS_FLINT; print('mpmath', mpmath.__version__, 'python-flint', flint.__version__)"
      - name: Run validator and full fast suite with latest Flint
        run: |
          python -m pytest -v tests/test_validation.py
          python -m pytest -v

  windows-fast:
    name: Windows spawn and fast gate · py3.12
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with Flint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout "mpmath==1.3.0"
          python -m pip install --upgrade python-flint
      - name: Confirm Windows and Flint
        run: |
          python -c "import platform, flint; assert platform.system() == 'Windows'; print('python-flint', flint.__version__)"
          python -c "from connes_cvs import operator; assert operator.HAS_FLINT, 'Windows tests require the Flint backend'"
      - name: Exercise spawn path explicitly
        run: >-
          python -m pytest -v
          tests/test_runner_identity.py::test_runner_parallel_matches_serial
      - name: Run full fast suite
        run: python -m pytest -v

  static:
    name: static typing · mypy1.17.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with optional Flint stubs and pinned type checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast]" "mypy==1.17.1" "matplotlib>=3.6.0" pytest pytest-timeout
      - name: Confirm optional-backend stubs are present
        run: python -c "import flint; print('python-flint', flint.__version__)"
      - name: Type-check the package
        run: python -m mypy connes_cvs
      - name: Check figure imports, incomplete bundles and rendering
        env:
          MPLBACKEND: Agg
        run: |
          python -c "import matplotlib; print('matplotlib', matplotlib.__version__)"
          python -m pytest -v tests/test_figure_data_resolution.py

  exact-reference:
    name: exact c13 references · ubuntu · py3.12 · flint0.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the exact reference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-timeout "gmpy2==2.3.0" \
            "mpmath==1.4.1" "python-flint==0.8.0"
      - name: Refuse a silently changed numerical backend
        run: |
          python -c "import flint, gmpy2, mpmath; assert flint.__version__ == '0.8.0'; assert gmpy2.__version__ == '2.3.0'; assert mpmath.__version__ == '1.4.1'; assert mpmath.libmp.BACKEND == 'gmpy'; print('native', getattr(flint, '__FLINT_VERSION__', None), gmpy2.mp_version(), gmpy2.mpfr_version(), gmpy2.mpc_version())"
          python -c "from connes_cvs.operator import HAS_FLINT; assert HAS_FLINT"
      - name: Run slow reference regressions
        run: python -m pytest -v -s -m slow --timeout=1800

  release-archives:
    name: build, manifest, metadata, and clean-install gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [fast, flint-oldest, flint-latest, windows-fast, static, exact-reference]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.4.3" "twine==7.0.0"
      - name: Build wheel and sdist into an empty directory
        run: |
          test ! -e release-dist
          python -m build --sdist --wheel --outdir release-dist
      - name: Enforce exact fail-closed archive manifests
        run: python tools/verify_release.py --dist release-dist
      - name: Check package metadata strictly
        run: python -m twine check --strict release-dist/*
      - name: Clean-install and smoke-test each archive at the mpmath floor
        shell: bash
        run: |
          set -euo pipefail
          # The version is read from pyproject.toml rather than hardcoded, so a
          # release bump cannot leave this gate pointing at artifacts that no
          # longer exist. The glob is asserted to match exactly one file of each
          # kind, so a stale archive in release-dist/ cannot be silently tested.
          expected_version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          shopt -s nullglob
          wheels=(release-dist/*.whl)
          sdists=(release-dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          for artifact in "${wheels[0]}" "${sdists[0]}"
          do
            case "$(basename "$artifact")" in
              connes_cvs-"$expected_version"[.-]*) ;;
              *) echo "artifact $artifact does not match version $expected_version" >&2; exit 1 ;;
            esac
            kind=$(basename "$artifact" | tr '.-' '__')
            env_dir="$RUNNER_TEMP/install-$kind"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --upgrade pip
            "$env_dir/bin/python" -m pip install "mpmath==1.3.0" "$artifact"
            "$env_dir/bin/python" -m pip check
            (
              cd "$RUNNER_TEMP"
              PYTHONPATH='' EXPECTED_VERSION="$expected_version" "$env_dir/bin/python" -c \
                "import os, connes_cvs; from importlib.metadata import version; from connes_cvs import arb_eigenpair_residual_bound; from connes_cvs.runner import CellConfig; expected = os.environ['EXPECTED_VERSION']; assert version('connes-cvs') == connes_cvs.__version__ == expected, (version('connes-cvs'), connes_cvs.__version__, expected); assert callable(arb_eigenpair_residual_bound); assert CellConfig(c=2, N=1, T=1, dps=15).c == 2"
            )
          done
