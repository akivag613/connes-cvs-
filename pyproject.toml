[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "connes-cvs"
version = "0.3.1"
description = "Open-source arbitrary-precision construction and validation of the Connes-van Suijlekom Galerkin matrix."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Akiva Groskin" },
]
keywords = [
    "riemann-hypothesis",
    "spectral-theory",
    "number-theory",
    "connes",
    "van-suijlekom",
    "weil-positivity",
    "galerkin",
    "arbitrary-precision",
    "computational-mathematics",
    "l-functions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "mpmath>=1.3.0",
]

[project.optional-dependencies]
fast = [
    "python-flint>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "gmpy2>=2.1.0",
    "python-flint>=0.5.0",
]
science = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
all = [
    "python-flint>=0.5.0",
    "gmpy2>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.6.0",
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage      = "https://github.com/akivag613/connes-cvs-"
Documentation = "https://github.com/akivag613/connes-cvs-#readme"
Repository    = "https://github.com/akivag613/connes-cvs-"
Issues        = "https://github.com/akivag613/connes-cvs-/issues"
Changelog     = "https://github.com/akivag613/connes-cvs-/blob/main/CHANGELOG.md"
arXiv         = "https://arxiv.org/abs/2605.20224"
Paper         = "https://arxiv.org/abs/2605.20224"
Zenodo        = "https://doi.org/10.5281/zenodo.19546514"

[tool.hatch.build.targets.wheel]
# The wheel ships the importable package and nothing else.
only-include = ["connes_cvs"]
include = [
    "/connes_cvs/README.md",
    "/connes_cvs/__init__.py",
    "/connes_cvs/kernels.py",
    "/connes_cvs/operator.py",
    "/connes_cvs/py.typed",
    "/connes_cvs/runner.py",
    "/connes_cvs/sweep.py",
    "/connes_cvs/validation.py",
]

[tool.hatch.build.targets.sdist]
# Allowlist, not denylist: only the paths named here reach the sdist, so a new
# local-only file cannot leak by default. Directories that mix public and
# local-only content (tests/, examples/, benchmarks/) are enumerated file by
# file; a new public file in one of them must be added here to ship.
include = [
    "/connes_cvs/README.md",
    "/connes_cvs/__init__.py",
    "/connes_cvs/kernels.py",
    "/connes_cvs/operator.py",
    "/connes_cvs/py.typed",
    "/connes_cvs/runner.py",
    "/connes_cvs/sweep.py",
    "/connes_cvs/validation.py",
    "/tests/README.md",
    "/tests/reference_values.json",
    "/tests/test_c13_regression.py",
    "/tests/test_matrix_microopt_v0_2_0.py",
    "/tests/test_runner_identity.py",
    "/tests/test_operator_hardening.py",
    "/tests/test_release_artifacts.py",
    "/tests/test_runner_checkpoints.py",
    "/tests/test_validation.py",
    "/examples/README.md",
    "/examples/basic_compute.py",
    "/examples/c100_aitken_check.py",
    "/examples/make_fig9_c100_aitken.py",
    "/examples/make_fig10_c100_gamma_digits.py",
    "/data/README.md",
    "/data/results_15pt_T800.json",
    "/data/c100/README.md",
    "/data/c100/c100_N120_dps560_gamma_extraction.json",
    "/data/c100/c100_N150_dps1000_gamma_extraction.json",
    "/data/c100/c100_N150_gamma_extraction_retight.json",
    "/data/c100/c100_N160_dps560_gamma_extraction.json",
    "/data/c100/c100_N250_dps500_gamma_extraction.json",
    "/data/c100/results_c100_N100_T800_dps500_v020.json",
    "/data/c100/results_c100_N150_T800_dps1000_v020.json",
    "/data/c100/results_c100_N150_T800_dps500_v020.json",
    "/data/c100/results_c100_N200_T800_dps500_v020.json",
    "/data/c100/results_c100_N250_T800_dps500_v020.json",
    "/data/c100/results_c67_N150_T800_dps500_v020.json",
    "/data/c100/richardson_n_extrapolation.json",
    "/data/third_party/karl-keysingularity/2026-08-02_c13_validation_artifact.json",
    "/data/third_party/karl-keysingularity/README.md",
    "/benchmarks/README.md",
    "/benchmarks/AB_VERIFIED_2026-04-14.md",
    "/benchmarks/baseline_benchmark.py",
    "/benchmarks/win1_benchmark.py",
    "/benchmarks/win1_pool_benchmark.py",
    "/README.md",
    "/ERRATA.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
    "/.github/release-files.json",
    "/.gitignore",
    "/tools/verify_release.py",
]
# Build hygiene. The allowlist above is the exclusion mechanism: anything not
# named there is absent from the sdist by construction, so no local-only path
# needs to be enumerated here.
exclude = [
    "**/__pycache__",
    "*.py[co]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs the fast suite; the slow regression gate is
# selected explicitly with `pytest -m slow` (the CLI -m overrides this).
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests that take >60 seconds (e.g., full matrix construction)",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
